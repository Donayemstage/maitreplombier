<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="logoWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Blason Bleu Agrandi & Centré verticalement -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoBlue)" />
    <!-- Clé à molette -->
    <path d="M 45.5 21 C 41.1 21 37.6 24.5 37.6 28.9 C 37.6 31.1 38.5 33 40 34.4 L 24.9 49.5 C 23.6 50.8 23.6 53 24.9 54.3 C 26.2 55.6 28.4 55.6 29.7 54.3 L 44.8 39.2 C 46.2 40.7 48.1 41.6 50.3 41.6 C 54.7 41.6 58.2 38.1 58.2 33.7 C 58.2 32.4 57.8 31.2 57.1 30.2 L 51.2 36.1 L 45.3 30.2 L 51.2 24.3 C 49.5 22.2 47.7 21 45.5 21 Z" fill="#FFFFFF" />
    <!-- Goutte d'eau bleu clair -->
    <path d="M 52.5 45.5 C 52.5 40.2 45.5 33.2 45.5 33.2 C 45.5 33.2 38.5 40.2 38.5 45.5 C 38.5 49.3 41.6 52.5 45.5 52.5 C 49.4 52.5 52.5 49.3 52.5 45.5 Z" fill="url(#logoWater)" />
  </g>

  <!-- Groupe Texte & Sinusoïde Rééquilibré -->
  <g transform="translate(88, 0)">
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-style="italic" font-size="24" fill="#0F172A" letter-spacing="1">MAÎTRE</text>
    <text x="0" y="60" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#2563EB" letter-spacing="1">PLOMBIER</text>
    
    <!-- Sinusoïde Orange expressive -->
    <path d="M 145 52 C 165 66, 110 70, 50 70 C 10 70, 160 73, 185 62 C 195 57, 190 47, 180 52 C 172 56, 183 67, 192 62" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
