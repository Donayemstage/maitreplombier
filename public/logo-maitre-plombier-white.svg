    <text x="0" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-style="italic" font-size="27" fill="#38BDF8" letter-spacing="1.2">PLOMBERIE</text>
    
